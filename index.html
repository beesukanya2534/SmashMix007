<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>จับคู่ตีแบด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Kanit:ital,wght@0,400;0,500;0,600;0,700;1,800&display=swap" rel="stylesheet">
<style>
  :root{
    --court:#0B0F14;
    --court-deep:#050708;
    --court-light:#141B22;
    --panel:#11161C;
    --line:#F2F6F8;
    --muted:#7E93A3;
    --muted-dim:#48606f;
    --lime:#C6FF1E;
    --lime-dim:#9fd400;
    --electric:#00D9FF;
    --coral:#FF3D7A;
    --gold:#FFD400;
    --radius:16px;
    --shadow: 0 10px 30px rgba(0,0,0,0.5);
    --glow-lime: 0 0 0 1px rgba(198,255,30,0.4), 0 0 22px rgba(198,255,30,0.35);
    --glow-electric: 0 0 22px rgba(0,217,255,0.3);
    --glow-gold: 0 0 30px rgba(255,212,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% -8%, rgba(0,217,255,0.10), transparent 42%),
      radial-gradient(circle at 92% 8%, rgba(198,255,30,0.07), transparent 38%),
      radial-gradient(circle at 50% 100%, rgba(255,61,122,0.05), transparent 45%),
      linear-gradient(180deg, var(--court-deep) 0%, var(--court) 100%);
    background-attachment:fixed;
    color:var(--line);
    font-family:'Inter','Kanit',sans-serif;
    min-height:100vh;
    padding-bottom:84px;
  }
  h1,h2,h3,.display{
    font-family:'Teko','Kanit',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-weight:700;
    margin:0;
  }
  /* ---------- header ---------- */
  header.top{
    padding:22px 18px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid rgba(234,242,233,0.08);
  }
  header.top .shuttle{font-size:30px;line-height:1;filter:drop-shadow(0 0 10px rgba(198,255,30,0.5));}
  header.top .titles h1{font-size:30px;color:var(--line);}
  header.top .titles p{margin:2px 0 0;font-size:12px;color:var(--muted);letter-spacing:0.04em;text-transform:uppercase;font-family:'Inter',sans-serif;font-weight:600;}

  /* net divider - signature element (glowing court net) */
  .net-divider{
    height:10px;
    background-image:
      repeating-linear-gradient(45deg, rgba(0,217,255,0.45) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(-45deg, rgba(0,217,255,0.45) 0 1px, transparent 1px 8px);
    opacity:0.6;
    margin:18px 0;
    border-radius:2px;
    filter:drop-shadow(0 0 6px rgba(0,217,255,0.25));
  }

  main{max-width:920px;margin:0 auto;padding:0 16px 40px;}

  /* ---------- desktop nav ---------- */
  nav.tabs{
    display:flex;
    gap:6px;
    max-width:920px;
    margin:0 auto;
    padding:14px 16px 0;
  }
  nav.tabs button{
    flex:1;
    background:transparent;
    border:none;
    color:var(--muted);
    font-family:'Teko',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-size:18px;
    padding:10px 6px 14px;
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:all .15s ease;
  }
  nav.tabs button.active{color:var(--lime);border-bottom-color:var(--lime);text-shadow:0 0 14px rgba(198,255,30,0.5);}
  nav.tabs button:hover{color:var(--line);}

  /* ---------- mobile bottom nav ---------- */
  nav.bottom{
    display:none;
  }
  @media (max-width:680px){
    nav.tabs{display:none;}
    nav.bottom{
      display:flex;
      position:fixed;
      bottom:0;left:0;right:0;
      background:var(--court-deep);
      border-top:1px solid rgba(234,242,233,0.1);
      padding:8px 6px calc(8px + env(safe-area-inset-bottom));
      z-index:50;
    }
    nav.bottom button{
      flex:1;
      background:none;border:none;color:var(--muted);
      display:flex;flex-direction:column;align-items:center;gap:2px;
      font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
      padding:4px 0;
      cursor:pointer;
    }
    nav.bottom button .ic{font-size:19px;}
    nav.bottom button.active{color:var(--lime);text-shadow:0 0 12px rgba(198,255,30,0.5);}
  }

  section.panel{
    background:var(--panel);
    border-radius:var(--radius);
    padding:18px;
    margin-top:18px;
    box-shadow:var(--shadow);
    border:1px solid rgba(0,217,255,0.08);
  }
  .panel h2{font-size:24px;margin-bottom:2px;}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 14px;}

  /* ---------- form controls ---------- */
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type=text], select, input[type=number]{
    background:var(--court-deep);
    border:1px solid rgba(234,242,233,0.15);
    color:var(--line);
    padding:11px 12px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    outline:none;
  }
  input[type=text]:focus, select:focus, input[type=number]:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(198,255,30,0.12);}
  input[type=text]{flex:1;min-width:140px;}
  .btn{
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-family:'Teko',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-size:18px;
    cursor:pointer;
    transition:transform .1s ease, filter .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--lime);color:var(--court-deep);}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:var(--glow-lime);}
  .btn-ghost{background:transparent;color:var(--line);border:1px solid rgba(234,242,233,0.25);}
  .btn-ghost:hover{border-color:var(--electric);color:var(--electric);}
  .btn-danger{background:transparent;color:var(--coral);border:1px solid rgba(255,61,122,0.4);}
  .btn-danger:hover{background:rgba(255,61,122,0.1);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-block{width:100%;padding:14px;font-size:20px;}

  /* ---------- player list ---------- */
  ul.players{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
  ul.players li{
    display:flex;align-items:center;gap:10px;
    background:var(--court-deep);
    border-radius:10px;
    padding:9px 10px 9px 14px;
  }
  ul.players li .name{flex:1;font-weight:600;font-size:14.5px;}
  .badge{
    font-family:'Teko',sans-serif;
    font-weight:700;font-size:13px;
    padding:3px 9px;border-radius:20px;
    text-transform:uppercase;letter-spacing:0.03em;
  }
  .badge.M{background:rgba(0,217,255,0.15);color:var(--electric);}
  .badge.F{background:rgba(255,61,122,0.15);color:var(--coral);}
  .badge.U{background:rgba(234,242,233,0.1);color:var(--muted);}
  .icon-btn{
    background:none;border:none;color:var(--muted-dim);cursor:pointer;
    font-size:16px;padding:4px 6px;border-radius:6px;
  }
  .icon-btn:hover{color:var(--coral);background:rgba(255,61,122,0.1);}
  .count-chip{
    font-family:'Teko',sans-serif;font-weight:700;color:var(--lime);
    font-size:16px;
  }

  /* ---------- courts / random draw ---------- */
  .round-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .round-head .rnum{font-size:15px;color:var(--muted);}
  .round-head .rnum b{color:var(--lime);}

  .courts-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:14px;
    margin-top:16px;
  }
  .court-card{
    background:var(--court-deep);
    border-radius:14px;
    padding:14px;
    border:1px solid rgba(0,217,255,0.1);
    position:relative;
    overflow:hidden;
  }
  .court-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--lime),var(--electric) 60%,transparent 100%);
    filter:drop-shadow(0 0 6px rgba(198,255,30,0.4));
  }
  .court-card .court-label{
    font-family:'Teko',sans-serif;font-weight:700;text-transform:uppercase;
    color:var(--lime);font-size:16px;letter-spacing:0.06em;margin-bottom:10px;
  }
  .team-line{display:flex;flex-direction:column;gap:2px;padding:6px 0;}
  .team-line .p{font-size:15px;font-weight:600;}
  .vs{
    text-align:center;color:var(--electric);font-family:'Teko',sans-serif;
    font-weight:700;font-size:14px;letter-spacing:0.1em;padding:4px 0;opacity:0.85;
  }
  .resting-box{
    margin-top:16px;padding:12px 14px;border-radius:12px;
    background:rgba(234,242,233,0.04);border:1px dashed rgba(234,242,233,0.18);
  }
  .resting-box .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;margin-bottom:6px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    background:rgba(234,242,233,0.08);
    padding:4px 10px;border-radius:20px;font-size:13px;
  }
  .chip.paired{background:rgba(198,255,30,0.1);color:var(--lime);}

  .empty{
    text-align:center;padding:30px 10px;color:var(--muted);font-size:14px;
  }
  .empty .big{font-size:34px;margin-bottom:8px;}

  /* ---------- tournament bracket ---------- */
  .bracket-scroll{overflow-x:auto;padding-bottom:8px;margin-top:10px;}
  .bracket{display:flex;gap:34px;min-width:max-content;padding:6px 2px;}
  .bracket-col{display:flex;flex-direction:column;gap:24px;min-width:210px;justify-content:space-around;}
  .bracket-col .col-title{
    font-family:'Teko',sans-serif;font-weight:700;text-transform:uppercase;
    color:var(--muted);font-size:16px;letter-spacing:0.06em;text-align:center;margin-bottom:4px;
  }
  .match-card{
    background:var(--court-deep);
    border:1px solid rgba(234,242,233,0.1);
    border-radius:12px;
    overflow:hidden;
  }
  .team-slot{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px;font-size:13.5px;font-weight:600;
    border-bottom:1px solid rgba(234,242,233,0.08);
    cursor:default;
  }
  .team-slot:last-child{border-bottom:none;}
  .team-slot.empty-slot{color:var(--muted-dim);font-style:italic;}
  .team-slot.winner{color:var(--lime);background:rgba(198,255,30,0.1);text-shadow:0 0 12px rgba(198,255,30,0.4);}
  .team-slot.winner::after{content:"🏆";margin-left:8px;font-size:12px;}
  .team-slot.loser{color:var(--muted-dim);opacity:0.65;}

  .completed-games{
    display:flex;flex-wrap:wrap;gap:5px;
    padding:8px 12px 0;
  }
  .completed-games .g{
    font-size:11.5px;color:var(--muted);
    background:rgba(234,242,233,0.06);
    padding:2px 8px;border-radius:10px;
  }
  .score-summary{
    font-size:12.5px;color:var(--muted);text-align:center;
    padding:6px 12px 2px;letter-spacing:0.02em;
  }
  .score-entry{
    display:flex;align-items:center;gap:8px;
    padding:10px 12px 12px;
  }
  .score-entry .game-lbl{
    font-size:13px;color:var(--muted);min-width:44px;
    font-family:'Teko',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;
  }
  .score-input{
    width:48px;text-align:center;padding:8px 4px;
    -moz-appearance:textfield;
  }
  .score-input::-webkit-outer-spin-button,
  .score-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .score-entry .dash{color:var(--muted-dim);font-weight:700;}
  .btn-sm{padding:7px 12px;font-size:15px;border-radius:8px;}
  .btn-link{
    display:block;width:100%;background:none;border:none;
    color:var(--muted);font-size:11.5px;text-decoration:underline;
    cursor:pointer;padding:4px 12px 10px;text-align:center;
  }
  .btn-link:hover{color:var(--electric);}
  .bye-note{
    text-align:center;font-size:11.5px;color:var(--muted-dim);
    padding:8px 12px 12px;font-style:italic;
  }

  .champion-box{
    margin-top:24px;
    text-align:center;
    padding:30px 20px;
    border-radius:18px;
    background:linear-gradient(160deg, rgba(255,212,0,0.16), rgba(255,212,0,0.02));
    border:1px solid rgba(255,212,0,0.4);
    box-shadow:var(--glow-gold);
    position:relative;
    overflow:hidden;
    animation:pop .5s cubic-bezier(.2,1.4,.4,1), champGlow 2.4s ease-in-out infinite;
  }
  @keyframes pop{from{transform:scale(0.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes champGlow{0%,100%{box-shadow:0 0 20px rgba(255,212,0,0.25);}50%{box-shadow:0 0 38px rgba(255,212,0,0.45);}}
  .champion-box .trophy{font-size:44px;margin-bottom:6px;filter:drop-shadow(0 0 12px rgba(255,212,0,0.6));}
  .champion-box .lbl{color:var(--gold);font-size:14px;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;font-family:'Teko',sans-serif;}
  .champion-box .names{font-size:34px;font-family:'Teko',sans-serif;font-weight:700;color:var(--line);margin-top:6px;text-transform:uppercase;}
  .confetti{position:absolute;top:-10px;width:8px;height:14px;opacity:0.9;animation:fall linear forwards;border-radius:2px;}
  @keyframes fall{to{transform:translateY(220px) rotate(360deg);opacity:0;}}

  .banner{
    background:rgba(198,255,30,0.1);
    border:1px solid rgba(198,255,30,0.3);
    color:var(--lime);
    padding:10px 14px;border-radius:10px;font-size:13.5px;
    margin-top:14px;
  }
  .banner.warn{background:rgba(255,61,122,0.08);border-color:rgba(255,61,122,0.3);color:var(--coral);}

  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
    background:var(--line);color:var(--court-deep);
    padding:10px 18px;border-radius:30px;font-size:13.5px;font-weight:600;
    box-shadow:var(--shadow);z-index:100;opacity:0;pointer-events:none;
    transition:opacity .25s ease, bottom .25s ease;
  }
  .toast.show{opacity:1;bottom:106px;}
  @media (min-width:681px){.toast{bottom:30px;}.toast.show{bottom:40px;}}

  select#modeSelect, select#genderSelect{min-width:120px;}
  label.f-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;display:block;margin-bottom:4px;}
  .field{display:flex;flex-direction:column;}
  .g-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

  /* ================= anime layer ================= */
  main{position:relative;z-index:2;}
  header.top, nav.tabs{position:relative;z-index:3;}
  .gh-link{
    margin-left:auto;display:inline-flex;align-items:center;gap:8px;
    color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;
    border:1px solid rgba(234,242,233,0.18);border-radius:999px;padding:8px 14px;
    transition:color .15s, border-color .15s, box-shadow .15s;
  }
  .gh-link:hover{color:var(--lime);border-color:var(--lime);box-shadow:var(--glow-lime);}
  .gh-link:focus-visible,.btn:focus-visible,.chibi-peek:focus-visible{outline:2px solid var(--electric);outline-offset:3px;}
  .gh-link .code{font-family:'Teko',sans-serif;font-size:18px;line-height:1;color:var(--electric);}

  /* splash / cover */
  .splash{
    position:fixed;inset:0;z-index:200;overflow:hidden;
    background:
      radial-gradient(circle at 78% 45%, rgba(0,217,255,0.16), transparent 45%),
      radial-gradient(circle at 20% 90%, rgba(198,255,30,0.08), transparent 40%),
      #050708;
    display:flex;align-items:center;
    transition:transform .8s cubic-bezier(.75,0,.25,1), opacity .8s ease;
  }
  .splash.hide{transform:translateY(-104%);}
  .splash.gone{display:none;}
  .splash-copy{position:relative;z-index:3;padding:0 6vw;max-width:640px;}
  .splash-kicker{
    display:inline-flex;align-items:center;gap:8px;color:var(--electric);
    font-family:'Teko',sans-serif;font-size:22px;letter-spacing:0.08em;
    animation:rise .7s .15s both;
  }
  .splash-title{
    font-family:'Kanit',sans-serif;font-style:italic;font-weight:800;
    font-size:clamp(56px,8.4vw,128px);line-height:0.95;margin:6px 0 14px;
    text-transform:none;letter-spacing:-0.01em;
    color:var(--line);
    text-shadow:0 0 40px rgba(198,255,30,0.25);
    animation:slam .8s .25s cubic-bezier(.2,1.3,.4,1) both;
  }
  .splash-title .l2{display:block;white-space:nowrap;color:var(--lime);-webkit-text-stroke:0;padding-left:0.6em;}
  .splash-copy p{color:var(--muted);font-size:16px;line-height:1.6;max-width:30em;margin:0 0 26px;animation:rise .7s .5s both;}
  .splash-actions{display:flex;gap:12px;flex-wrap:wrap;animation:rise .7s .65s both;}
  .splash-actions .btn{font-size:22px;padding:12px 26px;text-decoration:none;display:inline-flex;align-items:center;}
  .splash-hero{
    position:absolute;right:-1vw;bottom:0;z-index:2;
    height:min(98vh,920px);aspect-ratio:583/640;mix-blend-mode:lighten;
    animation:heroIn 1s .1s cubic-bezier(.2,.9,.2,1) both;
  }
  .splash-hero::before{content:"";position:absolute;inset:8% 4% 0 22%;background:radial-gradient(ellipse at 55% 45%, rgba(0,217,255,0.22), transparent 62%);filter:blur(10px);}
  .splash-hero .float{position:absolute;inset:0;animation:float 4.5s 1.1s ease-in-out infinite;}
  .hero-img{
    width:100%;height:100%;display:block;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 16%),linear-gradient(to bottom,transparent 0,#000 10%);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to right,transparent 0,#000 16%),linear-gradient(to bottom,transparent 0,#000 10%);
    mask-composite:intersect;
    animation:zap 3.2s 1.2s infinite;
  }
  .bolts{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
  .bolts path{
    fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:260;stroke-dashoffset:260;
    filter:drop-shadow(0 0 6px currentColor);
    animation:bolt 3.2s infinite;
  }
  .bolts .b1{stroke:var(--electric);color:var(--electric);animation-delay:1.3s;}
  .bolts .b2{stroke:var(--lime);color:var(--lime);animation-delay:2.1s;}
  .bolts .b3{stroke:var(--electric);color:var(--electric);animation-delay:2.7s;}
  .shuttle-glow{
    position:absolute;left:0;top:70%;width:24%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle, rgba(0,217,255,0.45), transparent 65%);
    animation:pulse 1.6s ease-in-out infinite;pointer-events:none;
  }
  .splash-chibi{
    position:absolute;z-index:4;bottom:0;left:clamp(260px,38vw,560px);width:150px;
    animation:popUp .7s 1s cubic-bezier(.2,1.5,.4,1) both;
  }
  .splash-chibi img{width:100%;display:block;}
  .splash-chibi .bubble{left:auto;right:88%;top:4px;}

  @keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
  @keyframes slam{from{opacity:0;transform:translateX(-40px) skewX(-12deg);}to{opacity:1;transform:none;}}
  @keyframes heroIn{from{opacity:0;transform:translateX(18%);clip-path:polygon(40% 0,100% 0,100% 100%,60% 100%);}to{opacity:1;transform:none;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-14px) rotate(-0.6deg);}}
  @keyframes zap{0%,86%,100%{filter:none;}88%{filter:brightness(1.35) saturate(1.3);}90%{filter:none;}92%{filter:brightness(1.25);}}
  @keyframes bolt{0%{stroke-dashoffset:260;opacity:1;}14%{stroke-dashoffset:0;opacity:1;}30%,100%{stroke-dashoffset:0;opacity:0;}}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.9);}50%{opacity:.9;transform:scale(1.08);}}
  @keyframes popUp{from{transform:translateY(110%);}to{transform:none;}}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  @keyframes hop{0%,100%{transform:translateY(0);}30%{transform:translateY(-22px) rotate(-4deg);}60%{transform:translateY(0);}75%{transform:translateY(-8px);}}
  @keyframes bubbleIn{from{opacity:0;transform:scale(.6) translateY(6px);}to{opacity:1;transform:none;}}
  @keyframes slash{0%{transform:translateX(-110%) rotate(-7deg);opacity:0;}20%{opacity:1;}100%{transform:translateX(110%) rotate(-7deg);opacity:0;}}

  /* side hero in the app */
  .side-hero{
    position:fixed;right:-70px;bottom:0;z-index:1;pointer-events:none;
    height:min(76vh,600px);aspect-ratio:583/640;display:none;mix-blend-mode:lighten;
  }
  .side-hero .float{position:absolute;inset:0;animation:float 5s ease-in-out infinite;}
  @media (min-width:1380px){.side-hero{display:block;}.hero-banner{display:none!important;}}
  .hero-banner{
    position:relative;height:230px;margin-top:18px;border-radius:var(--radius);overflow:hidden;
    background:radial-gradient(circle at 75% 40%, rgba(0,217,255,0.18), transparent 60%),#050708;
    border:1px solid rgba(0,217,255,0.12);display:flex;align-items:center;
  }
  .hero-banner img{
    position:absolute;right:-2%;top:-14%;height:250%;mix-blend-mode:lighten;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 25%);mask-image:linear-gradient(to right,transparent 0,#000 25%);
    animation:float 4.5s ease-in-out infinite;
  }
  .hb-text{position:relative;z-index:2;padding:0 22px;font-family:'Kanit',sans-serif;font-style:italic;font-weight:800;font-size:clamp(34px,7vw,56px);color:var(--lime);line-height:1;text-shadow:0 0 24px rgba(198,255,30,0.35);}
  .hb-text span{display:block;font-style:normal;font-weight:500;font-size:14px;color:var(--muted);margin-top:8px;text-shadow:none;}
  @media (max-width:680px){.hero-banner{height:190px;}.hero-banner img{right:-30%;height:230%;}}

  /* chibi peeking over panels */
  section.panel.has-chibi{position:relative;margin-top:96px;}
  .chibi-peek{
    position:absolute;right:26px;bottom:100%;width:104px;cursor:pointer;
    background:none;border:none;padding:0;
    animation:bob 2.6s ease-in-out infinite;
  }
  .chibi-peek img{width:100%;display:block;pointer-events:none;}
  .chibi-peek.hop{animation:hop .7s ease;}
  .chibi-peek.party{animation:hop .8s ease infinite;}
  .bubble{
    position:absolute;right:92%;top:0;white-space:nowrap;
    background:var(--line);color:var(--court-deep);
    font-family:'Kanit',sans-serif;font-weight:600;font-size:13.5px;
    padding:7px 13px;border-radius:14px 14px 4px 14px;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
    animation:bubbleIn .35s cubic-bezier(.2,1.5,.4,1) both;
  }
  .panel-slash{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit;}
  .panel-slash::after{
    content:"";position:absolute;top:46%;left:-10%;width:120%;height:3px;
    background:linear-gradient(90deg,transparent,var(--lime),var(--electric),transparent);
    box-shadow:0 0 18px var(--electric);
    animation:slash .7s ease-out both;
  }

  /* fixed pairs */
  .lock{font-size:12px;margin-left:4px;opacity:.9;}
  .fix-row select{flex:1;min-width:120px;}
  .fix-row .plus{color:var(--lime);font-family:'Teko',sans-serif;font-size:24px;}
  ul.players li.fixed-pair{border:1px solid rgba(198,255,30,0.25);}
  .team-line .p.locked::after{content:" 🔒";font-size:12px;}

  @media (max-width:900px){
    .splash{align-items:flex-start;padding-top:max(8vh,env(safe-area-inset-top));}
    .splash-hero{height:66vh;right:-12vw;opacity:.95;}
    .splash-chibi{display:none;}
    .splash-copy p{max-width:22em;}
  }
  @media (max-width:680px){
    .gh-link .txt{display:none;}
    .chibi-peek{width:82px;right:14px;}
    section.panel.has-chibi{margin-top:80px;}
    .bubble{font-size:12px;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;}
    .bolts path{stroke-dashoffset:0;opacity:.6;}
  }
</style>
</head>

/* ============================================================

   ============================================================ */
function uid(){return nextId++;}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function pairKey(a,b){return [a,b].sort((x,y)=>x-y).join('|');}
function hasPlayedTogether(a,b){return partnerHistory.has(pairKey(a,b));}
function playerById(id){return players.find(p=>p.id===id);}
function isFixedId(id){return fixedPairs.some(([a,b])=>a===id||b===id);}
function isFixedTeam(t){return t && t.length===2 && fixedPairs.some(([a,b])=>pairKey(a,b)===pairKey(t[0].id,t[1].id));}
function fixedTeamsIn(pool){
  const ids = new Set(pool.map(p=>p.id));
  return fixedPairs.filter(([a,b])=>ids.has(a)&&ids.has(b)).map(([a,b])=>[playerById(a),playerById(b)]);
}

/* ============================================================
   TEAM BUILDING ALGORITHM (avoids repeat partners where possible)
   ============================================================ */
function compatFn(mode){
  if(mode==='male')   return (a,b)=> a.gender==='M' && b.gender==='M';
  if(mode==='female')  return (a,b)=> a.gender==='F' && b.gender==='F';
  if(mode==='mixed')  return (a,b)=> (a.gender==='M'&&b.gender==='F') || (a.gender==='F'&&b.gender==='M');
  return ()=>true; // all
}
function eligiblePool(mode){
  if(mode==='male') return players.filter(p=>p.gender==='M');
  if(mode==='female') return players.filter(p=>p.gender==='F');
  if(mode==='mixed') return players.filter(p=>p.gender==='M'||p.gender==='F');
  return players.slice();
}
// Attempts several randomized greedy builds, keeps the one with fewest repeat partnerships
// and prioritizes pairing players who rested last round.
function buildTeams(pool, mode, attempts=120){
  const compat = compatFn(mode);
  // คู่ที่ Fix ไว้ จับเป็นทีมก่อนเสมอ ที่เหลือค่อยสุ่ม
  const fixedTeams = fixedTeamsIn(pool);
  const lockedIds = new Set(fixedTeams.flat().map(p=>p.id));
  const freePool = pool.filter(p=>!lockedIds.has(p.id));
  let best = null;
  for(let a=0; a<attempts; a++){
    // priority: players who rested last round go first (get partnered first)
    const rested = shuffle(freePool.filter(p=>lastResting.has(p.id)));
    const others = shuffle(freePool.filter(p=>!lastResting.has(p.id)));
    const order = rested.concat(others);
    const remaining = order.slice();
    const teams = [];
    while(remaining.length){
      const p1 = remaining.shift();
      // 1st pass: compatible + no repeat
      let idx = remaining.findIndex(p2=>compat(p1,p2) && !hasPlayedTogether(p1.id,p2.id));
      // 2nd pass: compatible even if repeat
      if(idx===-1) idx = remaining.findIndex(p2=>compat(p1,p2));
      if(idx===-1){ continue; } // no compatible partner found, p1 sits out
      const p2 = remaining.splice(idx,1)[0];
      teams.push([p1,p2]);
    }
    const repeats = teams.filter(([x,y])=>hasPlayedTogether(x.id,y.id)).length;
    const allTeams = fixedTeams.concat(teams);
    const matchedIds = new Set(allTeams.flat().map(p=>p.id));
    const unmatched = pool.filter(p=>!matchedIds.has(p.id));
    const score = allTeams.length*100 - repeats*10 - unmatched.length; // maximize teams, minimize repeats/unmatched
    if(!best || score>best.score){
      best = {teams:allTeams, unmatched, score};
    }
  }
  return best || {teams:fixedTeams, unmatched:freePool.slice()};
}

function teamPriorityScore(team){
  return team.filter(p=>lastResting.has(p.id)).length + Math.random()*0.5;
}

function generateRound(){
  const pool = eligiblePool(mode);
  if(pool.length < 4){
    toast('ต้องมีผู้เล่นที่เข้าเงื่อนไขอย่างน้อย 4 คน');
    return;
  }
  const {teams, unmatched} = buildTeams(pool, mode);
  const skipped = fixedPairs.length - fixedTeamsIn(pool).length;
  if(skipped>0) toast(`มีคู่ล็อค ${skipped} คู่ที่ไม่เข้าโหมดนี้ จึงไม่ได้ลงรอบนี้`);
  justShuffled = true;
  if(teams.length < numCourts*2){
    // not enough teams for requested courts - just use as many as possible, warn
  }
  // sort teams by priority (rested-last-round players first), keep some randomness
  const orderedTeams = teams.map(t=>({t, s:teamPriorityScore(t)})).sort((x,y)=>y.s-x.s).map(x=>x.t);

  const courts = [];
  const teamsUsedThisRound = [];
  let ti = 0;
  for(let c=1; c<=numCourts && ti+1<orderedTeams.length; c++){
    const teamA = orderedTeams[ti++];
    const teamB = orderedTeams[ti++];
    courts.push({court:c, teamA, teamB});
    teamsUsedThisRound.push(teamA, teamB);
  }
  const leftoverTeams = orderedTeams.slice(ti); // teams formed but no court available
  const waiting = leftoverTeams.map(t=>({players:t}));
  unmatched.forEach(p=>waiting.push({players:[p]}));

  // update history: every team formed this round (even ones not on court) counts as "partnered"
  orderedTeams.forEach(([a,b])=>partnerHistory.add(pairKey(a.id,b.id)));

  // figure resting ids for next round's fairness priority
  const playingIds = new Set(courts.flatMap(c=>[...c.teamA,...c.teamB]).map(p=>p.id));
  lastResting = new Set(pool.filter(p=>!playingIds.has(p.id)).map(p=>p.id));

  roundNumber++;
  currentRound = {roundNumber, courts, waiting};
  render();
}

/* ============================================================
   TOURNAMENT
   ============================================================ */
function nextPow2(n){let p=1; while(p<n) p*=2; return p;}

// Badminton single-game score validity (new international format, effective 2027):
// race to 15, win by 2 at 14-14 deuce, hard cap at 21 (first to 21 wins outright).
function isValidGameScore(a,b){
  if(!Number.isInteger(a) || !Number.isInteger(b)) return false;
  if(a<0 || b<0 || a>21 || b>21) return false;
  if(a===b) return false;
  const hi = Math.max(a,b), lo = Math.min(a,b);
  if(hi===21) return true;         // 21-x always wins once capped
  if(hi<15) return false;
  return (hi-lo) >= 2;
}
function gameWinnerSide(m, g){
  return g.a>g.b ? 'A' : 'B';
}

function startTournamentFromTeams(teamList){
  // teamList: array of [p1,p2]
  if(teamList.length < 2){
    toast('ต้องมีอย่างน้อย 2 ทีมเพื่อเริ่มสาย');
    return;
  }
  const shuffled = shuffle(teamList);
  const size = nextPow2(shuffled.length);
  const byes = size - shuffled.length;
  const slots = shuffled.map(t=>({players:t}));
  for(let i=0;i<byes;i++) slots.push(null); // null = bye slot

  const round1 = [];
  for(let i=0;i<slots.length;i+=2){
    const teamA = slots[i], teamB = slots[i+1];
    const m = {
      id: matchIdCounter++,
      teamA, teamB,
      winner: null,
      games: [],
      isBye: !teamA || !teamB
    };
    if(m.isBye){ m.winner = teamA || teamB; }
    round1.push(m);
  }
  const rounds = [round1];
  let count = round1.length;
  while(count>1){
    count = count/2;
    const r = [];
    for(let i=0;i<count;i++){
      r.push({id:matchIdCounter++, teamA:null, teamB:null, winner:null, games:[], isBye:false});
    }
    rounds.push(r);
  }
  tournament = {rounds, champion:null};
  propagateByes();
  render();
}

function propagateByes(){
  // push any auto-decided winners (byes) into next round's slots
  for(let r=0; r<tournament.rounds.length-1; r++){
    const round = tournament.rounds[r];
    const nextRound = tournament.rounds[r+1];
    round.forEach((m, i)=>{
      if(m.winner){
        const nm = nextRound[Math.floor(i/2)];
        if(i%2===0) nm.teamA = m.winner; else nm.teamB = m.winner;
        if(nm.teamA && !nm.teamB && isSlotBye(nextRound, i)){ /* noop */ }
      }
    });
  }
  // check final
  const lastRound = tournament.rounds[tournament.rounds.length-1];
  if(lastRound.length===1 && lastRound[0].winner){
    tournament.champion = lastRound[0].winner;
  }
}
function isSlotBye(){return false;}

function gameWins(m){
  const w = {A:0,B:0};
  m.games.forEach(g=>{ w[g.a>g.b?'A':'B']++; });
  return w;
}

// Records one game's score for a match. Once a side reaches 2 game wins
// (best-of-3), the match winner is set and propagated to the next round.
function confirmGame(roundIdx, matchIdx){
  const m = tournament.rounds[roundIdx][matchIdx];
  if(!m.teamA || !m.teamB || m.winner) return;
  const aInput = document.getElementById(`scoreA-${roundIdx}-${matchIdx}`);
  const bInput = document.getElementById(`scoreB-${roundIdx}-${matchIdx}`);
  const a = parseInt(aInput.value, 10);
  const b = parseInt(bInput.value, 10);
  if(!isValidGameScore(a,b)){
    toast('คะแนนไม่ถูกต้อง (ต้องถึง 15 และห่างกัน 2 แต้ม หรือจบที่ 21 แต้ม)');
    return;
  }
  m.games.push({a,b});
  const wins = gameWins(m);

  if(wins.A>=2 || wins.B>=2){
    const side = wins.A>=2 ? 'A' : 'B';
    const winner = side==='A' ? m.teamA : m.teamB;
    m.winner = winner;
    if(roundIdx === tournament.rounds.length-1){
      tournament.champion = winner;
    } else {
      const nextRound = tournament.rounds[roundIdx+1];
      const nm = nextRound[Math.floor(matchIdx/2)];
      if(matchIdx%2===0) nm.teamA = winner; else nm.teamB = winner;
    }
    toast('จบแมตช์! ผู้แพ้กลับเข้ารอบสุ่มใหม่ได้เลย');
  } else {
    toast(`บันทึกเกม ${m.games.length} แล้ว กรอกเกมถัดไป`);
  }
  render();
}

// Clears a match's result (and cascades forward, clearing any later match
// that had already been decided based on this one's winner).
function clearMatch(roundIdx, matchIdx){
  const m = tournament.rounds[roundIdx][matchIdx];
  m.games = [];
  m.winner = null;
  if(roundIdx === tournament.rounds.length-1){
    tournament.champion = null;
  } else {
    const nextRound = tournament.rounds[roundIdx+1];
    const nmIdx = Math.floor(matchIdx/2);
    const nm = nextRound[nmIdx];
    if(nm.winner || nm.games.length){
      clearMatch(roundIdx+1, nmIdx);
    }
    if(matchIdx%2===0) nm.teamA = null; else nm.teamB = null;
  }
}

function resetTournament(){
  tournament = null;
  render();
}

function teamNames(team){
  if(!team) return '';
  return team.players.map(p=>p.name).join(' / ');
}

function renderMatchCard(m, ri, mi){
  // one or both slots not yet filled
  if(!m.teamA || !m.teamB){
    const slotHtml = (team, isBye) => {
      if(team) return `<div class="team-slot ${m.winner===team?'winner':''}">${teamNames(team)}</div>`;
      return `<div class="team-slot empty-slot">${isBye?'บาย':'รอทีม...'}</div>`;
    };
    const body = `${slotHtml(m.teamA,false)}${slotHtml(m.teamB, m.isBye)}`;
    const byeNote = m.isBye ? `<div class="bye-note">ผ่านเข้ารอบอัตโนมัติ (บาย)</div>` : '';
    return `<div class="match-card">${body}${byeNote}</div>`;
  }

  // both teams present, match already decided
  if(m.winner){
    const gamesHtml = m.games.map(g=>`<span class="g">${g.a}-${g.b}</span>`).join('');
    return `<div class="match-card">
      <div class="team-slot ${m.winner===m.teamA?'winner':'loser'}">${teamNames(m.teamA)}</div>
      <div class="team-slot ${m.winner===m.teamB?'winner':'loser'}">${teamNames(m.teamB)}</div>
      <div class="completed-games">${gamesHtml}</div>
      <button class="btn-link" data-clear="${ri}-${mi}">✎ แก้ไขผล</button>
    </div>`;
  }

  // both teams present, match in progress: score entry
  const gamesHtml = m.games.length ? `<div class="completed-games">${m.games.map(g=>`<span class="g">${g.a}-${g.b}</span>`).join('')}</div>` : '';
  const gameNum = m.games.length + 1;
  return `<div class="match-card">
    <div class="team-slot">${teamNames(m.teamA)}</div>
    <div class="team-slot">${teamNames(m.teamB)}</div>
    ${gamesHtml}
    <div class="score-entry">
      <span class="game-lbl">เกม ${gameNum}</span>
      <input type="number" class="score-input" id="scoreA-${ri}-${mi}" min="0" max="21" placeholder="0">
      <span class="dash">-</span>
      <input type="number" class="score-input" id="scoreB-${ri}-${mi}" min="0" max="21" placeholder="0">
      <button class="btn btn-primary btn-sm" data-confirmgame="${ri}-${mi}">✓ บันทึก</button>
    </div>
  </div>`;
}

function renderTourneyTab(){
  if(!tournament){
    const canFromRound = currentRound && (currentRound.courts.length>0 || currentRound.waiting.some(w=>w.players.length===2));
    return `
      <section class="panel has-chibi">
        ${chibiHTML(chibiLine())}
        <h2>สายการแข่งขัน</h2>
        <p class="sub">สร้างสายแบบแพ้คัดออก จากทีมที่จับคู่ไว้ หรือจากผู้เล่นทั้งหมดโดยตรง</p>
        <div class="empty"><div class="big">🏆</div>ยังไม่มีสายการแข่งขัน</div>
        <div class="g-actions">
          <button class="btn btn-primary btn-block" id="startFromRoundBtn" ${canFromRound?'':'disabled'}>เริ่มสายจากรอบจับคู่ปัจจุบัน</button>
          <button class="btn btn-ghost btn-block" id="startFromAllBtn">สร้างสายจากผู้เล่นทั้งหมด (สุ่มใหม่)</button>
        </div>
        ${!canFromRound ? '<p class="sub" style="margin-top:10px;">* ไปที่แท็บ "จับคู่สุ่ม" เพื่อสร้างทีมก่อน หรือใช้ปุ่มด้านล่างเพื่อสุ่มทีมจากผู้เล่นทั้งหมดโดยตรง</p>' : ''}
      </section>`;
  }

  const roundTitles = tournament.rounds.map((r,i)=>{
    if(i === tournament.rounds.length-1) return 'รอบชิงชนะเลิศ';
    return `รอบ ${i+1}`;
  });

  const cols = tournament.rounds.map((round, ri)=>{
    const matches = round.map((m, mi)=> renderMatchCard(m, ri, mi)).join('');
    return `<div class="bracket-col"><div class="col-title">${roundTitles[ri]}</div>${matches}</div>`;
  }).join('');

  const championHtml = tournament.champion ? `
    <div class="champion-box" id="championBox">
      <div class="trophy">🏆</div>
      <div class="lbl">แชมป์</div>
      <div class="names">${teamNames(tournament.champion)}</div>
    </div>` : '';

  const cheer = tournament.champion ? `เย่! แชมป์คือ ${teamNames(tournament.champion)}` : chibiLine();
  return `
    <section class="panel has-chibi">
      ${chibiHTML(cheer)}
      <div class="row" style="justify-content:space-between;">
        <h2>สายการแข่งขัน</h2>
        <button class="btn btn-danger" id="resetTourneyBtn">เริ่มสายใหม่</button>
      </div>
      <p class="sub">กรอกคะแนนแต่ละเกม (กติกาสากลใหม่: 15 แต้ม แข่ง 2 ใน 3 เกม) ทีมที่ชนะ 2 เกมก่อนจะเลื่อนขึ้นรอบถัดไปอัตโนมัติ ผู้แพ้กลับไปสุ่มรอบใหม่ได้</p>
      <div class="bracket-scroll"><div class="bracket">${cols}</div></div>
      ${championHtml}
    </section>
  `;
}

function render(){
  const main = document.getElementById('main');
  let html = '';
  if(activeTab==='players') html = renderPlayersTab();
  else if(activeTab==='draw') html = renderDrawTab();
  else html = renderTourneyTab();
  main.innerHTML = html;
  attachHandlers();

  document.querySelectorAll('nav button[data-tab]').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===activeTab);
  });

  saveRoster();
  if(activeTab==='tourney' && tournament && tournament.champion){
    launchConfetti();
    const c = document.getElementById('chibi'); if(c) c.classList.add('party');
  }
  if(justShuffled){
    justShuffled = false;
    const c = document.getElementById('chibi'); if(c) c.classList.add('hop');
  }
}

function launchConfetti(){
  const box = document.getElementById('championBox');
  if(!box || box.dataset.done) return;
  box.dataset.done = '1';
  const colors = ['#C6FF1E','#FFD400','#00D9FF','#FF3D7A'];
  for(let i=0;i<28;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100+'%';
    c.style.background = colors[i%colors.length];
    c.style.animationDuration = (1.2+Math.random()*1.2)+'s';
    c.style.animationDelay = (Math.random()*0.4)+'s';
    box.appendChild(c);
    setTimeout(()=>c.remove(), 3000);
  }
}

function attachHandlers(){
  // nav
  document.querySelectorAll('nav button[data-tab]').forEach(b=>{
    b.onclick = ()=>{ activeTab = b.dataset.tab; render(); };
  });

  // chibi: click for a new line + hop
  const chibi = document.getElementById('chibi');
  if(chibi && !chibi.classList.contains('party')){
    chibi.onclick = ()=>{
      const lines = CHIBI_LINES[activeTab];
      const bub = document.getElementById('chibiBubble');
      const next = lines[(lines.indexOf(bub.textContent)+1) % lines.length];
      bub.textContent = next;
      bub.style.animation='none'; void bub.offsetWidth; bub.style.animation='';
      chibi.classList.remove('hop'); void chibi.offsetWidth; chibi.classList.add('hop');
    };
  }

  // fix pairs
  const fixA = document.getElementById('fixA'), fixB = document.getElementById('fixB');
  if(fixA && fixB && fixB.options.length>1 && fixA.value===fixB.value) fixB.selectedIndex = 1;
  const addFixBtn = document.getElementById('addFixBtn');
  if(addFixBtn) addFixBtn.onclick = ()=>{
    const a = Number(fixA.value), b = Number(fixB.value);
    if(a===b){ toast('เลือกผู้เล่น 2 คนที่ต่างกัน'); return; }
    fixedPairs.push([a,b]);
    const A=playerById(a), B=playerById(b);
    toast(`ล็อคคู่ ${A.name} + ${B.name} แล้ว 🔒`);
    render();
  };
  document.querySelectorAll('[data-unfix]').forEach(b=>{
    b.onclick = ()=>{ fixedPairs.splice(Number(b.dataset.unfix),1); render(); };
  });

  // players tab
  const form = document.getElementById('addPlayerForm');
  if(form){
    form.onsubmit = (e)=>{
      e.preventDefault();
      const nameInput = document.getElementById('nameInput');
      const genderSelect = document.getElementById('genderSelect');
      const name = nameInput.value.trim();
      if(!name) return;
      players.push({id:uid(), name, gender:genderSelect.value});
      nameInput.value='';
      render();
      document.getElementById('nameInput').focus();
    };
  }
  document.querySelectorAll('[data-remove]').forEach(b=>{
    b.onclick = ()=>{
      const id = Number(b.dataset.remove);
      players = players.filter(p=>p.id!==id);
      fixedPairs = fixedPairs.filter(([a,b])=>a!==id && b!==id);
      render();
    };
  });
  const clearBtn = document.getElementById('clearPlayersBtn');
  if(clearBtn) clearBtn.onclick = ()=>{
    if(confirm('ล้างรายชื่อผู้เล่นทั้งหมด?')){
      players = []; fixedPairs = []; currentRound=null; tournament=null; partnerHistory=new Set(); lastResting=new Set(); roundNumber=0;
      render();
    }
  };

  // draw tab
  const courtsInput = document.getElementById('courtsInput');
  if(courtsInput) courtsInput.onchange = ()=>{
    numCourts = Math.max(1, Math.min(20, Number(courtsInput.value)||1));
  };
  const modeSelect = document.getElementById('modeSelect');
  if(modeSelect) modeSelect.onchange = ()=>{ mode = modeSelect.value; };
  const reshuffleBtn = document.getElementById('reshuffleBtn');
  if(reshuffleBtn) reshuffleBtn.onclick = ()=>{
    if(courtsInput) numCourts = Math.max(1, Math.min(20, Number(courtsInput.value)||1));
    if(modeSelect) mode = modeSelect.value;
    generateRound();
  };
  const sendTourneyBtn = document.getElementById('sendTourneyBtn');
  if(sendTourneyBtn) sendTourneyBtn.onclick = ()=>{
    const teamList = [];
    currentRound.courts.forEach(c=>{ teamList.push(c.teamA); teamList.push(c.teamB); });
    currentRound.waiting.forEach(w=>{ if(w.players.length===2) teamList.push(w.players); });
    activeTab='tourney';
    startTournamentFromTeams(teamList);
  };

  // tourney tab
  const startFromRoundBtn = document.getElementById('startFromRoundBtn');
  if(startFromRoundBtn) startFromRoundBtn.onclick = ()=>{
    const teamList = [];
    currentRound.courts.forEach(c=>{ teamList.push(c.teamA); teamList.push(c.teamB); });
    currentRound.waiting.forEach(w=>{ if(w.players.length===2) teamList.push(w.players); });
    startTournamentFromTeams(teamList);
  };
  const startFromAllBtn = document.getElementById('startFromAllBtn');
  if(startFromAllBtn) startFromAllBtn.onclick = ()=>{
    const pool = eligiblePool(mode);
    if(pool.length<4){ toast('ต้องมีผู้เล่นที่เข้าเงื่อนไขอย่างน้อย 4 คน'); return; }
    const {teams} = buildTeams(pool, mode);
    teams.forEach(([a,b])=>partnerHistory.add(pairKey(a.id,b.id)));
    startTournamentFromTeams(teams);
  };
  const resetTourneyBtn = document.getElementById('resetTourneyBtn');
  if(resetTourneyBtn) resetTourneyBtn.onclick = ()=>{
    if(confirm('เริ่มสายการแข่งขันใหม่? ผลปัจจุบันจะถูกล้าง')) resetTournament();
  };
  document.querySelectorAll('[data-confirmgame]').forEach(btn=>{
    btn.onclick = ()=>{
      const [ri, mi] = btn.dataset.confirmgame.split('-').map(Number);
      confirmGame(ri, mi);
    };
  });
  document.querySelectorAll('[data-clear]').forEach(btn=>{
    btn.onclick = ()=>{
      const [ri, mi] = btn.dataset.clear.split('-').map(Number);
      if(confirm('แก้ไขผลแมตช์นี้? ผลของรอบถัดไปที่ต่อจากแมตช์นี้จะถูกล้างไปด้วย')){
        clearMatch(ri, mi);
        render();
      }
    };
  });
}

render();
</script>
